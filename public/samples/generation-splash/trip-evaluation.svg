<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Trip evaluation generation scene</title><desc id="description">An evaluator reviews a report across five criteria and applies an approval mark.</desc>
  <style>
    .row{animation:row 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.r2{animation-delay:-3.6s}.r3{animation-delay:-2.7s}.r4{animation-delay:-1.8s}.r5{animation-delay:-.9s}.stamp{animation:stamp 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes row{0%,16%{opacity:.3;transform:scaleX(.94)}45%,100%{opacity:1;transform:scaleX(1)}}@keyframes stamp{0%,66%{opacity:0;transform:scale(1.5) rotate(-14deg)}82%,100%{opacity:1;transform:scale(1) rotate(0)}}
    @media (prefers-reduced-motion:reduce){.row,.stamp{animation:none!important}}
  </style>
