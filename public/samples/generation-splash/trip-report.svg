<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Trip report generation scene</title><desc id="description">A photo, receipt, and location marker are organized into a report notebook.</desc>
  <style>
    .source{animation:source 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.receipt{animation-delay:-1.8s}.pin{animation-delay:-3.6s}.book{animation:book 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes source{0%,100%{transform:translateY(18px) rotate(-2deg);opacity:.55}50%{transform:translateY(-16px) rotate(2deg);opacity:1}}@keyframes book{0%,100%{transform:scale(.99)}50%{transform:scale(1.015)}}
    @media (prefers-reduced-motion:reduce){.source,.book{animation:none!important}}
  </style>
  <rect width="1600" height="900" fill="#dceee8"/><path d="M0 650c260-110 390 70 670-30 310-110 570 70 930-55v335H0Z" fill="#75a58d"/><path d="M0 735c350-105 520 85 850-35 270-100 470 30 750-20v220H0Z" fill="#426f5d"/><path d="M205 0c65 180 17 318 150 460 135 148 139 285 100 440" fill="none" stroke="#f7d981" stroke-width="78" opacity=".72"/><path d="M205 0c65 180 17 318 150 460 135 148 139 285 100 440" fill="none" stroke="#fff8dd" stroke-width="8" stroke-dasharray="28 30"/>
  <g class="book"><rect x="820" y="154" width="600" height="590" rx="34" fill="#153b4c" opacity=".22"/><rect x="790" y="130" width="600" height="590" rx="34" fill="#fdfcf6" stroke="#274d5f" stroke-width="12"/><rect x="790" y="130" width="78" height="590" rx="30" fill="#e3a843"/><g stroke="#705225" stroke-width="12"><path d="M770 210h76m-76 72h76m-76 72h76m-76 72h76m-76 72h76m-76 72h76m-76 72h76"/></g><rect x="934" y="218" width="350" height="24" rx="12" fill="#2e6c8b"/><g fill="#b4c6cb"><rect x="934" y="284" width="386" height="13" rx="7"/><rect x="934" y="326" width="330" height="13" rx="7"/><rect x="934" y="368" width="370" height="13" rx="7"/></g><g fill="#d6e7dd"><rect x="934" y="434" width="162" height="116" rx="14"/><rect x="1120" y="434" width="200" height="116" rx="14"/></g><path d="M957 526l42-54 32 35 38-50 27 69Z" fill="#5a9277"/><g fill="#7292a0"><rect x="948" y="601" width="340" height="12" rx="6"/><rect x="948" y="643" width="275" height="12" rx="6"/></g></g>
  <g class="source photo"><rect x="130" y="190" width="260" height="210" rx="18" fill="#fff" stroke="#2f6070" stroke-width="8" transform="rotate(-8 260 295)"/><path d="M164 342l78-88 52 59 50-72 28 103Z" fill="#62a17b" transform="rotate(-8 260 295)"/><circle cx="318" cy="232" r="25" fill="#f0c45b"/></g>
  <g class="source receipt"><path d="M480 170h218v300l-20-15-20 15-20-15-20 15-20-15-20 15-20-15-20 15-20-15-18 15Z" fill="#fff" stroke="#526f79" stroke-width="8" transform="rotate(7 589 320)"/><g fill="#8ba0a7" transform="rotate(7 589 320)"><rect x="520" y="226" width="138" height="13" rx="7"/><rect x="520" y="270" width="112" height="13" rx="7"/><rect x="520" y="314" width="138" height="13" rx="7"/><rect x="520" y="386" width="138" height="20" rx="8"/></g></g>
  <g class="source pin"><circle cx="450" cy="575" r="94" fill="#fff" stroke="#326b82" stroke-width="9"/><path d="M450 500c-42 0-70 29-70 66 0 55 70 126 70 126s70-71 70-126c0-37-28-66-70-66Z" fill="#dc6858"/><circle cx="450" cy="564" r="25" fill="#fff"/></g>
